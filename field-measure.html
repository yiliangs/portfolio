<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>field measure</title></head><body>
<pre id="out">pending</pre>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { VERTEX_SHADER, FRAGMENT_SHADER } from './src/background-field.glsl.js';

// Measurement rig for the dissolve. It exists because the effect is judged by
// statistics, not by eye: a dissolve is distinguished from a gradient-plus-
// noise by grain variance RISING with local brightness, and by most of the
// frame sitting at exactly the ground value. TARGET below holds those numbers
// as measured off the reference screenshot.
//
// It does its own three.js setup rather than going through mount(), so uTime
// can be driven to chosen values instead of wall clock. That is the whole
// point: statistics taken at one arbitrary moment of the drift describe where
// the plume happened to be, not the effect. Every variant is scored over the
// same eight points in the drift.
//
// Usage: /field-measure.html?v=[["name",{"DUST_GAIN":"0.40"}], ...]
// Results land in the page and are beaconed to /__sweep for a driver to read.

const W = 700, H = 440;
const TIMES = [0, 6, 13, 21, 30, 40, 52, 65];   // spread across the drift
const TARGET = { p90: 36.0, p99: 68.0, mx: 119.0, floor: 50.3,
                 bands: [0.88, 6.13, 13.46, 19.31] };

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
const scene = new THREE.Scene();
const camera = new THREE.Camera();
const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2(W, H) },
};
const material = new THREE.ShaderMaterial({
  uniforms, vertexShader: VERTEX_SHADER, fragmentShader: FRAGMENT_SHADER,
  depthTest: false, depthWrite: false,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
quad.frustumCulled = false;
scene.add(quad);
const gl = renderer.getContext();
const px = new Uint8Array(W * H * 4);

function patch(src, subs) {
  for (const [k, v] of Object.entries(subs)) {
    const re = new RegExp('(const\\s+float\\s+' + k + '\\s*=\\s*)[\\d.]+');
    if (!re.test(src)) throw new Error('no such constant: ' + k);
    src = src.replace(re, '$1' + v);
  }
  return src;
}

// 9x9 box mean via two separable passes, so the band analysis matches the
// offline measurement exactly.
function boxBlur(a, w, h, k) {
  const r = k >> 1, tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    let acc = 0;
    for (let x = -r; x <= r; x++) acc += a[y * w + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      tmp[y * w + x] = acc / k;
      acc -= a[y * w + Math.min(w - 1, Math.max(0, x - r))];
      acc += a[y * w + Math.min(w - 1, Math.max(0, x + r + 1))];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc / k;
      acc -= tmp[Math.min(h - 1, Math.max(0, y - r)) * w + x];
      acc += tmp[Math.min(h - 1, Math.max(0, y + r + 1)) * w + x];
    }
  }
  return out;
}

const BANDS = [[8, 14], [14, 22], [22, 40], [40, 255]];

function frameStats() {
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  // Statistics are taken on INK DENSITY, 255 minus luminance, not on luminance
  // itself. The reference numbers in TARGET were measured off a dark reference
  // where the marks were light; the palette is now inverted, paper with ink on
  // it. Measuring density makes the two directly comparable, so the same
  // targets keep their meaning and a later re-inversion needs no new figures.
  const n = W * H, lum = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    lum[i] = 255 - (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  }
  const sorted = Float32Array.from(lum).sort();
  const q = (f) => sorted[Math.min(n - 1, Math.floor(f * n))];
  const p50 = q(0.50);
  const box = boxBlur(lum, W, H, 9);
  let floor = 0;
  for (let i = 0; i < n; i++) if (Math.abs(lum[i] - p50) < 0.6) floor++;
  const bands = BANDS.map(([lo, hi]) => {
    let s = 0, s2 = 0, c = 0;
    for (let i = 0; i < n; i++) {
      if (box[i] >= lo && box[i] < hi) { const r = lum[i] - box[i]; s += r; s2 += r * r; c++; }
    }
    return c > 500 ? Math.sqrt(s2 / c - (s / c) ** 2) : NaN;
  });
  return { p50, p90: q(0.90), p99: q(0.99), mx: sorted[n - 1], floor: floor / n * 100, bands };
}

function err(m) {
  const e = [];
  for (const k of ['p90', 'p99', 'mx', 'floor']) e.push(Math.abs(m[k] - TARGET[k]) / TARGET[k]);
  m.bands.forEach((g, i) => {
    if (TARGET.bands[i] > 1 && isFinite(g)) e.push(Math.abs(g - TARGET.bands[i]) / TARGET.bands[i]);
  });
  return e.reduce((a, b) => a + b, 0) / e.length;
}

function evaluate(subs) {
  material.fragmentShader = patch(FRAGMENT_SHADER, subs);
  material.needsUpdate = true;
  const acc = [];
  for (const t of TIMES) {
    uniforms.uTime.value = t;
    renderer.render(scene, camera);
    acc.push(frameStats());
  }
  const avg = (f) => acc.reduce((s, m) => s + f(m), 0) / acc.length;
  const m = {
    p50: avg((x) => x.p50), p90: avg((x) => x.p90), p99: avg((x) => x.p99),
    mx: avg((x) => x.mx), floor: avg((x) => x.floor),
    bands: [0, 1, 2, 3].map((i) => avg((x) => x.bands[i] || 0)),
  };
  m.err = err(m);
  return m;
}

// ── clock mode ──────────────────────────────────────────────────────────────
// Walks uTime in fine steps and reports how much the picture changes between
// consecutive steps. A grain driven by a fixed reseed rate spends most steps
// almost unchanged and then jumps; motion carried by the field changes by a
// similar amount every step. This is the check that the grain has no beat for
// a reader to find.
//
// Read the series by its COEFFICIENT OF VARIATION, not by the height of a
// spectral peak. A hard reseed is an impulse train, so its energy spreads into
// every harmonic and lifts the median with it; peak-over-median then scores a
// clean clock LOWER than smooth motion, which is the wrong way round and cost
// one wrong reading here. Measured against a synthetic 14 Hz reseed, cv
// separates them by more than an order of magnitude: 2.43 for the clock,
// 0.095 for motion carried by the field.
function clockSeries(t0, dt, steps) {
  const S = 256;
  const cur = new Uint8Array(S * S * 4);
  let prev = null;
  const out = [];
  for (let i = 0; i < steps; i++) {
    uniforms.uTime.value = t0 + i * dt;
    renderer.render(scene, camera);
    gl.readPixels((W - S) >> 1, (H - S) >> 1, S, S, gl.RGBA, gl.UNSIGNED_BYTE, cur);
    if (prev) {
      let d = 0;
      for (let k = 0; k < cur.length; k += 4) d += Math.abs(cur[k] - prev[k]);
      out.push(+(d / (S * S)).toFixed(4));
    }
    prev = cur.slice();
  }
  return out;
}

// ── drift mode ──────────────────────────────────────────────────────────────
// Cross-correlates two frames a fixed interval apart and reports where the
// correlation peaks. A texture that is being carried across the screen peaks
// at an offset equal to how far it travelled; one that forms and dissolves in
// place peaks at zero however long the interval. This is the check that the
// grain has no direction to read, which a spectrum cannot tell you.
// Grab the full frame at a given uTime as one luminance plane.
function plane(t) {
  const buf = new Uint8Array(W * H * 4);
  uniforms.uTime.value = t;
  renderer.render(scene, camera);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const out = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) out[i] = buf[i * 4];
  return out;
}

// Split a frame into what moves and what does not. Grain is high frequency and
// the haze is low, and they have different motions by design, so correlating
// the raw frame measures a mixture: at short intervals the grain dominates and
// at long ones the haze does, which makes the raw reading look like drift that
// appears out of nowhere. Separating them first attributes each motion to its
// own layer.
function split(p, k) {
  // Separable box blur, so the low pass can be wide enough to actually hold
  // only the haze. A narrow kernel leaves grain in the low pass, and since the
  // grain is fixed to the screen that drags the haze reading toward zero and
  // reports the form as more still than it is.
  const r = k >> 1, tmp = new Float32Array(W * H), lo = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += p[y * W + Math.min(W - 1, Math.max(0, i))];
    for (let x = 0; x < W; x++) {
      tmp[y * W + x] = acc / k;
      acc -= p[y * W + Math.min(W - 1, Math.max(0, x - r))];
      acc += p[y * W + Math.min(W - 1, Math.max(0, x + r + 1))];
    }
  }
  for (let x = 0; x < W; x++) {
    let acc = 0;
    for (let j = -r; j <= r; j++) acc += tmp[Math.min(H - 1, Math.max(0, j)) * W + x];
    for (let y = 0; y < H; y++) {
      lo[y * W + x] = acc / k;
      acc -= tmp[Math.min(H - 1, Math.max(0, y - r)) * W + x];
      acc += tmp[Math.min(H - 1, Math.max(0, y + r + 1)) * W + x];
    }
  }
  const hi = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) hi[i] = p[i] - lo[i] + 128;
  return { lo, hi };
}

// The most textured SxS window. Correlating a window of bare paper returns
// zero for every offset, which reads as "no drift" no matter what is true.
function pickWindow(p, S) {
  let best = -1, bx = 0, by = 0;
  for (let y = 0; y + S <= H; y += 32) {
    for (let x = 0; x + S <= W; x += 32) {
      let s1 = 0, s2 = 0;
      for (let j = 0; j < S; j += 4) for (let i = 0; i < S; i += 4) {
        const v = p[(y + j) * W + x + i]; s1 += v; s2 += v * v;
      }
      const n = (S / 4) * (S / 4), v = s2 / n - (s1 / n) ** 2;
      if (v > best) { best = v; bx = x; by = y; }
    }
  }
  return { x: bx, y: by, variance: +best.toFixed(2) };
}

// Normalised cross-correlation over an integer search window.
function peakOffset(A, B, win, S, R) {
  let best = -2, bx = 0, by = 0;
  for (let oy = -R; oy <= R; oy++) {
    for (let ox = -R; ox <= R; ox++) {
      let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0, n = 0;
      for (let y = R; y < S - R; y += 2) {
        for (let x = R; x < S - R; x += 2) {
          const a = A[(win.y + y) * W + win.x + x];
          const b = B[(win.y + y + oy) * W + win.x + x + ox];
          sa += a; sb += b; saa += a * a; sbb += b * b; sab += a * b; n++;
        }
      }
      const ca = saa - sa * sa / n, cb = sbb - sb * sb / n;
      if (ca < 1e-6 || cb < 1e-6) continue;
      const r = (sab - sa * sb / n) / Math.sqrt(ca * cb);
      if (r > best) { best = r; bx = ox; by = oy; }
    }
  }
  return { dx: bx, dy: by, r: +best.toFixed(4) };
}

const qp = new URLSearchParams(location.search);
if (qp.has('drift')) {
  const R = 12, S = 256;
  const A = plane(20);
  const As = split(A, 25);
  const win = pickWindow(As.hi, S);
  const out = { window: win, grain: {}, haze: {} };
  for (const dt of [0.25, 0.5, 1.0, 2.0]) {
    const Bs = split(plane(20 + dt), 25);
    out.grain['dt' + dt] = peakOffset(As.hi, Bs.hi, win, S, R);
    out.haze['dt' + dt] = peakOffset(As.lo, Bs.lo, win, S, R);
  }
  // Sensitivity control: correlate a frame against itself shifted by a known
  // offset. If this does not come back as that offset, the detector is blind
  // and the zeros above mean nothing.
  {
    const B = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      B[y * W + x] = A[Math.min(H - 1, Math.max(0, y - 2)) * W
                       + Math.min(W - 1, Math.max(0, x - 3))];
    }
    out.control_shift_3_2 = peakOffset(As.hi, split(B, 25).hi, win, S, R);
  }
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
  new Image().src = '/__drift?r=' + encodeURIComponent(JSON.stringify(out));
}

if (qp.has('clock')) {
  const series = clockSeries(20, 1 / 120, 240);
  document.getElementById('out').textContent = JSON.stringify(series);
  new Image().src = '/__clock?r=' + encodeURIComponent(JSON.stringify(series));
}

const VARIANTS = JSON.parse(qp.get('v') || '[]');
const rows = [];
try {
  for (const [tag, subs] of VARIANTS) {
    const m = evaluate(subs);
    rows.push([tag, +m.p50.toFixed(1), +m.p90.toFixed(1), +m.p99.toFixed(1),
               +m.mx.toFixed(1), +m.floor.toFixed(1),
               m.bands.map((b) => +b.toFixed(2)), +m.err.toFixed(4)]);
  }
  document.getElementById('out').textContent = JSON.stringify(rows, null, 1);
  new Image().src = '/__sweep?r=' + encodeURIComponent(JSON.stringify(rows));
} catch (e) {
  new Image().src = '/__sweep?e=' + encodeURIComponent(String(e && e.message || e));
}
</script></body></html>
