<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flow check</title>
<style>html,body{margin:0;height:100%;background:#000}#bg{position:fixed;inset:0}
#out{position:fixed;left:0;top:0;color:#ccc;font:11px/1.4 monospace;z-index:9;white-space:pre}</style></head>
<body><div id="bg"></div><pre id="out">pending</pre>
<script type="module">
import { mount } from './src/background-field.js';

// Behavioural check for the pointer-as-disturbance design. Run with
// --force-prefers-reduced-motion so uTime is pinned: then the ONLY thing that
// can change a pixel is the pointer, and every number below is attributable.
//
//   phase 1  frames   1- 60   pointer parked          -> must be inert
//   phase 2  frames  61-140   pointer swept across    -> must disturb
//   phase 3  frames 141-460   pointer parked again    -> must settle back

const SWEEP_Y = 0.50, SWEEP_X0 = 0.18, SWEEP_X1 = 0.86;

const handle = mount(document.getElementById('bg'));
const canvas = document.querySelector('#bg canvas');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

// Whole-frame statistics, not a single block. A single probe reports only
// whichever patch it happens to sit on, and most of this frame is dead black
// by design, so a probe in a dark region measures nothing no matter what the
// pointer does. The lit fraction is the sensitive one: the dissolve turns
// grains on and off, so disturbing the field anywhere moves that count.
let buf = null;

function probe() {
  const w = canvas.width, h = canvas.height;
  if (!buf || buf.length !== w * h * 4) buf = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  let sum = 0, lit = 0;
  for (let i = 0; i < buf.length; i += 4) {
    const v = (buf[i] + buf[i + 1] + buf[i + 2]) / 3;
    sum += v;
    if (v > 14) lit++;
  }
  const n = buf.length / 4;
  return { mean: +(sum / n).toFixed(4), lit: +(lit / n * 100).toFixed(4) };
}

function move(fx, fy) {
  window.dispatchEvent(new PointerEvent('pointermove', {
    clientX: window.innerWidth * fx, clientY: window.innerHeight * fy,
  }));
}

const out = { reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches, marks: {} };
let n = 0;

function step() {
  n++;
  if (n > 61 && n <= 140) {
    const k = (n - 61) / 79;
    move(SWEEP_X0 + (SWEEP_X1 - SWEEP_X0) * k, SWEEP_Y);
  }
  // phase 3 sends nothing at all: the stored coordinates simply stop changing,
  // which is exactly what happens when a real pointer comes to rest.

  if (n === 20) out.marks.rest_a = probe();
  if (n === 60) out.marks.rest_b = probe();
  if (n === 100) out.marks.mid_sweep = probe();
  if (n === 140) out.marks.sweep_end = probe();
  if (n === 170) out.marks.after_030 = probe();
  if (n === 230) out.marks.after_090 = probe();
  if (n === 320) out.marks.after_180 = probe();
  if (n === 460) out.marks.after_320 = probe();

  document.getElementById('out').textContent = JSON.stringify(out, null, 1);

  if (n >= 460) {
    const m = out.marks;
    const d = (k) => Math.abs(m[k].lit - m.rest_b.lit);   // lit-fraction change
    out.verdict = {
      parked_is_inert: m.rest_a.lit === m.rest_b.lit && m.rest_a.mean === m.rest_b.mean,
      sweep_disturbs: d('mid_sweep') > 0.05,
      keeps_moving_after_stop: d('after_030') > 0.02,
      settles_monotonically: d('after_030') >= d('after_090') && d('after_090') >= d('after_320'),
      settled_back: d('after_320') < 0.02,
      deltas: { mid: d('mid_sweep').toFixed(4), end: d('sweep_end').toFixed(4),
                a030: d('after_030').toFixed(4), a090: d('after_090').toFixed(4),
                a180: d('after_180').toFixed(4), a320: d('after_320').toFixed(4) },
    };
    document.getElementById('out').textContent = JSON.stringify(out, null, 1);
    new Image().src = '/__flow?r=' + encodeURIComponent(JSON.stringify(out));
    return;
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script></body></html>
