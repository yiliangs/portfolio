<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yiliang — archive in progress</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; cursor: none; }
    #label {
      position: fixed;
      bottom: 1.75rem;
      left: 2rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label">archive in progress</div>

  <script>
    // ── Constants ────────────────────────────────────────────────────────────
    const CELL_W   = 10;
    const CELL_H   = 16;
    const FONT     = `13px "Courier New", monospace`;

    // Density ramp: index 0-1 are spaces (skipped in draw), rest are visible
    const CHARS    = '  ·∙:-=+*#▓█';
    const NC       = CHARS.length;   // 12
    const V_MAX    = 0.40;           // Gray-Scott V ceiling (typical)

    const DU       = 0.2097;
    const DV       = 0.105;
    const STEPS    = 6;              // RD iterations per rAF
    const WARMUP   = 80;             // pre-run steps on init

    const SEED_R   = 55;             // mouse seed radius, screen px

    // Gray-Scott parameter waypoints — all connected/labyrinthine, no isolated blobs
    const PARAM_SETS = [
      { f: 0.029, k: 0.057 },  // mazes
      { f: 0.037, k: 0.060 },  // fingerprints
      { f: 0.060, k: 0.062 },  // worms
      { f: 0.025, k: 0.060 },  // coral
      { f: 0.039, k: 0.058 },  // dense labyrinth
    ];

    const COLOR_DUR  = 13000;   // ms per color palette
    const PARAM_DUR  = 28000;   // ms per param transition

    // ── Canvas ───────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const label  = document.getElementById('label');
    const DPR    = window.devicePixelRatio || 1;

    let cols, rows;
    let U0, V0, U1, V1;   // ping-pong Float32Arrays

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width        = w * DPR;
      canvas.height       = h * DPR;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cols = Math.ceil(w / CELL_W) + 1;
      rows = Math.ceil(h / CELL_H) + 1;
      const n = cols * rows;
      U0 = new Float32Array(n);
      V0 = new Float32Array(n);
      U1 = new Float32Array(n);
      V1 = new Float32Array(n);
    }

    window.addEventListener('resize', () => { resize(); initRD(curF, curK); });

    // ── RD init ──────────────────────────────────────────────────────────────
    function initRD(f, k) {
      U0.fill(1);
      V0.fill(0);
      // Scatter seed patches (~0.3% of cells as 3×3 centers)
      const count = Math.max(20, Math.floor(cols * rows * 0.003));
      for (let p = 0; p < count; p++) {
        const r = 1 + Math.floor(Math.random() * (rows - 2));
        const c = 1 + Math.floor(Math.random() * (cols - 2));
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const i = (r + dr) * cols + (c + dc);
            V0[i] = 1;
            U0[i] = 0;
          }
        }
      }
      for (let s = 0; s < WARMUP; s++) stepRD(f, k);
    }

    // ── RD step (Gray-Scott, 9-point Laplacian, ping-pong) ───────────────────
    function stepRD(f, k) {
      for (let r = 0; r < rows; r++) {
        const rp = (r === 0        ? rows - 1 : r - 1) * cols;
        const rc =  r * cols;
        const rn = (r === rows - 1 ? 0        : r + 1) * cols;

        for (let c = 0; c < cols; c++) {
          const cp = c === 0        ? cols - 1 : c - 1;
          const cn = c === cols - 1 ? 0        : c + 1;
          const i  = rc + c;
          const u  = U0[i];
          const v  = V0[i];

          // 9-point Laplacian (corners 0.05, edges 0.20, center -1)
          const Lu = 0.05 * (U0[rp+cp] + U0[rp+cn] + U0[rn+cp] + U0[rn+cn])
                   + 0.20 * (U0[rp+c ] + U0[rc+cp] + U0[rc+cn] + U0[rn+c ])
                   - u;
          const Lv = 0.05 * (V0[rp+cp] + V0[rp+cn] + V0[rn+cp] + V0[rn+cn])
                   + 0.20 * (V0[rp+c ] + V0[rc+cp] + V0[rc+cn] + V0[rn+c ])
                   - v;

          const uvv = u * v * v;
          const nu  = u + DU * Lu - uvv + f * (1 - u);
          const nv  = v + DV * Lv + uvv - (f + k) * v;

          U1[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
          V1[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
        }
      }
      // Swap buffers
      let t = U0; U0 = U1; U1 = t;
          t = V0; V0 = V1; V1 = t;
    }

    // ── Mouse seed ───────────────────────────────────────────────────────────
    const ptr = { x: -9999, y: -9999, active: false };

    function seedMouse() {
      if (!ptr.active) return;
      const cx = ptr.x / CELL_W;
      const cy = ptr.y / CELL_H;
      const r0 = Math.max(0,        Math.floor(cy - SEED_R / CELL_H));
      const r1 = Math.min(rows - 1, Math.ceil (cy + SEED_R / CELL_H));
      const c0 = Math.max(0,        Math.floor(cx - SEED_R / CELL_W));
      const c1 = Math.min(cols - 1, Math.ceil (cx + SEED_R / CELL_W));
      const rr = SEED_R * SEED_R;

      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          const dx = (c + 0.5 - cx) * CELL_W;
          const dy = (r + 0.5 - cy) * CELL_H;
          const d2 = dx * dx + dy * dy;
          if (d2 < rr) {
            const t      = 1 - Math.sqrt(d2) / SEED_R;
            const smooth = t * t * (3 - 2 * t);       // smoothstep falloff
            const i      = r * cols + c;
            // Nudge toward activation — gradient, not hard fill
            V0[i] = Math.min(1, V0[i] + 0.28 * smooth);
            U0[i] = Math.max(0, U0[i] - 0.20 * smooth);
          }
        }
      }
    }

    // ── Draw ─────────────────────────────────────────────────────────────────
    function draw(bg, fg) {
      ctx.fillStyle = hsl(bg);
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.font         = FONT;
      ctx.textBaseline = 'top';
      ctx.fillStyle    = hsl(fg);

      let i = 0;
      for (let r = 0; r < rows; r++) {
        const y = r * CELL_H;
        for (let c = 0; c < cols; c++, i++) {
          const idx = Math.min(NC - 1, Math.floor(V0[i] / V_MAX * NC));
          if (idx < 2) continue;   // skip space chars — bg shows through
          ctx.fillText(CHARS[idx], c * CELL_W, y);
        }
      }

      // Cursor ring
      if (ptr.active) {
        ctx.beginPath();
        ctx.arc(ptr.x, ptr.y, SEED_R, 0, Math.PI * 2);
        ctx.strokeStyle = hsla(fg, 0.22);
        ctx.lineWidth   = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ptr.x, ptr.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = hsla(fg, 0.5);
        ctx.fill();
      }
    }

    // ── Color utilities ──────────────────────────────────────────────────────
    function randomPair() {
      const bgH = Math.random() * 360;
      const fgH = (bgH + 140 + Math.random() * 80) % 360;
      return {
        bg: { h: bgH, s: 30 + Math.random() * 35, l: 5  + Math.random() * 5  },
        fg: { h: fgH, s: 65 + Math.random() * 25, l: 62 + Math.random() * 18 },
      };
    }

    function lerpHSL(a, b, t) {
      let dh = b.h - a.h;
      if (dh >  180) dh -= 360;
      if (dh < -180) dh += 360;
      return { h: (a.h + dh * t + 360) % 360, s: a.s + (b.s - a.s) * t, l: a.l + (b.l - a.l) * t };
    }

    const hsl  = c => `hsl(${c.h.toFixed(1)},${c.s.toFixed(1)}%,${c.l.toFixed(1)}%)`;
    const hsla = (c, a) => `hsla(${c.h.toFixed(1)},${c.s.toFixed(1)}%,${c.l.toFixed(1)}%,${a})`;

    // ── Palette & param state ────────────────────────────────────────────────
    let palA = randomPair(), palB = randomPair(), palT = 0;

    function randParamIdx(exclude) {
      let i;
      do { i = Math.floor(Math.random() * PARAM_SETS.length); } while (i === exclude);
      return i;
    }

    let piA  = randParamIdx(-1);
    let piB  = randParamIdx(piA);
    let parT = 0;
    let curF = PARAM_SETS[piA].f;
    let curK = PARAM_SETS[piA].k;

    // ── Main loop ────────────────────────────────────────────────────────────
    let lastTs = 0;

    function loop(ts) {
      const dt = Math.min(ts - lastTs, 100);   // cap to survive backgrounded tabs
      lastTs = ts;

      // Color morph
      palT += dt / COLOR_DUR;
      if (palT >= 1) { palA = palB; palB = randomPair(); palT -= 1; }

      // Param morph
      parT += dt / PARAM_DUR;
      if (parT >= 1) { piA = piB; piB = randParamIdx(piA); parT -= 1; }
      curF = PARAM_SETS[piA].f + (PARAM_SETS[piB].f - PARAM_SETS[piA].f) * parT;
      curK = PARAM_SETS[piA].k + (PARAM_SETS[piB].k - PARAM_SETS[piA].k) * parT;

      const bg = lerpHSL(palA.bg, palB.bg, palT);
      const fg = lerpHSL(palA.fg, palB.fg, palT);

      label.style.color = hsl(fg);

      seedMouse();
      for (let s = 0; s < STEPS; s++) stepRD(curF, curK);
      draw(bg, fg);

      requestAnimationFrame(loop);
    }

    // ── Events ───────────────────────────────────────────────────────────────
    let isTouchDevice = false;

    window.addEventListener('mousemove', e => {
      if (isTouchDevice) return;
      ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true;
    });
    window.addEventListener('mouseleave', () => { ptr.active = false; });
    window.addEventListener('touchstart',  () => { isTouchDevice = true; }, { once: true });
    window.addEventListener('deviceorientation', e => {
      if (!isTouchDevice) return;
      const gx = Math.max(-45, Math.min(45,  e.gamma || 0));
      const by = Math.max(-45, Math.min(45, (e.beta  || 0) - 30));
      ptr.x = ((gx + 45) / 90) * window.innerWidth;
      ptr.y = ((by + 45) / 90) * window.innerHeight;
      ptr.active = true;
    });

    // ── Init ────────────────────────────────────────────────────────────────
    resize();
    initRD(curF, curK);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
