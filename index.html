<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.8">
  <title>yiliang — archive in progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; cursor: none; }
    #label {
      position: fixed;
      bottom: 1.75rem;
      left: 2rem;
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label">archive in progress</div>

  <script>
    // ── Constants ────────────────────────────────────────────────────────────
    const CELL_W   = 10;
    const CELL_H   = 16;
    const FONT     = `13px "Geist Mono", "Courier New", monospace`;
    const FONT_LG  = `${CELL_H * 2}px "Geist Mono", "Courier New", monospace`;  // 2× for title

    const CHARS    = '  ·∙:-=+░▒▓█';
    const NC       = CHARS.length;
    const V_MAX    = 0.40;

    const DU       = 0.2097;
    const DV       = 0.105;
    const STEPS    = 6;
    const WARMUP   = 80;
    const SEED_R   = 40;

    const PARAM_SETS = [
      { f: 0.029, k: 0.057 },
      { f: 0.037, k: 0.060 },
      { f: 0.060, k: 0.062 },
      { f: 0.025, k: 0.060 },
      { f: 0.039, k: 0.058 },
    ];

    const COLOR_DUR  = 8700;
    const PARAM_DUR  = 18700;
    const BOOST_R    = 70;
    const BOOST_STEPS = 3;

    // ── Text / box constants ─────────────────────────────────────────────────
    const TITLE_TEXT    = "YILIANG SHAO'S WORK";
    const SUBTITLE_TEXT = "The algorithm is forming itself. So is this site.";

    const TEXT_TARGET      = 0.36;   // V that border/subtitle cells maintain
    const TEXT_RESTORE     = 0.030;  // restoration rate  — ~0.8s full reform
    const TEXT_VISIBLE     = 0.10;   // V below which letter/border char hides
    const INTERIOR_DECAY   = 0.92;   // per-frame V decay for interior cells
    const TITLE_DISSOLVE_V = 0.06;   // avg interior V above which title starts to vanish

    // Box layout dimensions (in cells / rows)
    const BOX_PAD_X   = 3;   // inner horizontal padding
    const BOX_PAD_Y   = 1;   // inner vertical padding (rows)
    const TITLE_ROWS  = 2;   // rows allocated for large-font title
    const BOX_SPACER  = 1;   // rows between title and subtitle

    // ── Canvas ───────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const label  = document.getElementById('label');
    const DPR    = window.devicePixelRatio || 1;

    let cols, rows;
    let U0, V0, U1, V1;
    let textChars, textMask, interiorMask;
    let boxGeo = null;   // computed in buildTextMask, used in draw

    // ── Grid ─────────────────────────────────────────────────────────────────
    function buildGrid() {
      const n = cols * rows;
      U0 = new Float32Array(n);
      V0 = new Float32Array(n);
      U1 = new Float32Array(n);
      V1 = new Float32Array(n);
    }

    // ── Text mask ────────────────────────────────────────────────────────────
    //  textMask   → border + subtitle cells: V maintained at TEXT_TARGET
    //  interiorMask → remaining cells inside box: V decayed to 0 (clean bg)
    //  boxGeo     → geometry needed by draw() for the large-font title
    function buildTextMask() {
      const n = cols * rows;
      textChars    = new Array(n).fill(null);
      textMask     = new Uint8Array(n);
      interiorMask = new Uint8Array(n);

      // Box outer dimensions
      const boxInnerW = Math.max(SUBTITLE_TEXT.length, 40) + BOX_PAD_X * 2;
      const boxOuterW = boxInnerW + 2;
      // boxHeight: top + padY + titleRows + spacer + 1(sub) + padY + bottom
      const boxHeight = 1 + BOX_PAD_Y + TITLE_ROWS + BOX_SPACER + 1 + BOX_PAD_Y + 1;

      const boxLeft   = Math.floor((cols - boxOuterW) / 2);
      const boxRight  = boxLeft + boxOuterW - 1;
      const boxTop    = Math.floor((rows - boxHeight) / 2);
      const boxBottom = boxTop + boxHeight - 1;

      const titleRowStart = boxTop + 1 + BOX_PAD_Y;
      const subRow        = titleRowStart + TITLE_ROWS + BOX_SPACER;

      // Write one cell into textMask
      function put(row, col, ch) {
        if (row < 0 || row >= rows || col < 0 || col >= cols) return;
        const i      = row * cols + col;
        textChars[i] = ch;
        textMask[i]  = 1;
      }

      // ── Box border ─────────────────────────────────────────────────────
      put(boxTop,    boxLeft,  '╔');
      put(boxTop,    boxRight, '╗');
      put(boxBottom, boxLeft,  '╚');
      put(boxBottom, boxRight, '╝');
      for (let c = boxLeft + 1; c < boxRight; c++) {
        put(boxTop,    c, '═');
        put(boxBottom, c, '═');
      }
      for (let r = boxTop + 1; r < boxBottom; r++) {
        put(r, boxLeft,  '║');
        put(r, boxRight, '║');
      }

      // ── Subtitle ───────────────────────────────────────────────────────
      const subLeft = Math.floor((cols - SUBTITLE_TEXT.length) / 2);
      for (let c = 0; c < SUBTITLE_TEXT.length; c++) {
        put(subRow, subLeft + c, SUBTITLE_TEXT[c]);
      }

      // ── Interior mask — all non-text cells inside the box border ───────
      for (let r = boxTop + 1; r < boxBottom; r++) {
        for (let c = boxLeft + 1; c < boxRight; c++) {
          const i = r * cols + c;
          if (!textMask[i]) interiorMask[i] = 1;
        }
      }

      // ── Store geometry for draw() ──────────────────────────────────────
      const boxCenterX = (boxLeft + boxRight + 1) / 2;   // cells
      const titleCenterY = (titleRowStart + TITLE_ROWS / 2) * CELL_H;
      boxGeo = {
        titleDrawX:   boxCenterX * CELL_W,
        titleDrawY:   titleCenterY,
        titleR0:      titleRowStart,
        titleR1:      titleRowStart + TITLE_ROWS - 1,
        boxLeft,
        boxRight,
      };
    }

    // ── Resize ───────────────────────────────────────────────────────────────
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width        = w * DPR;
      canvas.height       = h * DPR;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cols = Math.ceil(w / CELL_W) + 1;
      rows = Math.ceil(h / CELL_H) + 1;
      buildGrid();
      buildTextMask();
    }

    window.addEventListener('resize', () => { resize(); initRD(curF, curK); });

    // ── Text + interior restoration (called every frame after stepRD) ────────
    function restoreText() {
      for (let i = 0; i < textMask.length; i++) {
        if (textMask[i]) {
          // Border / subtitle: restore V and U toward equilibrium
          V0[i] += TEXT_RESTORE * (TEXT_TARGET - V0[i]);
          U0[i] += TEXT_RESTORE * ((1 - TEXT_TARGET) - U0[i]);
        } else if (interiorMask[i]) {
          // Interior: decay V toward 0, keep U=1 (suppresses RD growth)
          V0[i] *= INTERIOR_DECAY;
          U0[i]  = 1;
        }
      }
    }

    // ── RD init ──────────────────────────────────────────────────────────────
    function initRD(f, k) {
      U0.fill(1);
      V0.fill(0);
      // Pre-seed text cells to target so they're visible from frame 1
      for (let i = 0; i < textMask.length; i++) {
        if (textMask[i]) { V0[i] = TEXT_TARGET; U0[i] = 1 - TEXT_TARGET; }
      }
      // Scatter random RD seeds outside the box
      const count = Math.max(20, Math.floor(cols * rows * 0.003));
      for (let p = 0; p < count; p++) {
        const r = 1 + Math.floor(Math.random() * (rows - 2));
        const c = 1 + Math.floor(Math.random() * (cols - 2));
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const i = (r + dr) * cols + (c + dc);
            if (!textMask[i] && !interiorMask[i]) { V0[i] = 1; U0[i] = 0; }
          }
        }
      }
      for (let s = 0; s < WARMUP; s++) { stepRD(f, k); restoreText(); }
    }

    // ── RD step ──────────────────────────────────────────────────────────────
    function stepRD(f, k) {
      for (let r = 0; r < rows; r++) {
        const rp = (r === 0        ? rows - 1 : r - 1) * cols;
        const rc =  r * cols;
        const rn = (r === rows - 1 ? 0        : r + 1) * cols;

        for (let c = 0; c < cols; c++) {
          const cp = c === 0        ? cols - 1 : c - 1;
          const cn = c === cols - 1 ? 0        : c + 1;
          const i  = rc + c;
          const u  = U0[i], v = V0[i];

          const Lu = 0.05 * (U0[rp+cp] + U0[rp+cn] + U0[rn+cp] + U0[rn+cn])
                   + 0.20 * (U0[rp+c ] + U0[rc+cp] + U0[rc+cn] + U0[rn+c ]) - u;
          const Lv = 0.05 * (V0[rp+cp] + V0[rp+cn] + V0[rn+cp] + V0[rn+cn])
                   + 0.20 * (V0[rp+c ] + V0[rc+cp] + V0[rc+cn] + V0[rn+c ]) - v;

          const uvv = u * v * v;
          const nu  = u + DU * Lu - uvv + f * (1 - u);
          const nv  = v + DV * Lv + uvv - (f + k) * v;

          U1[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
          V1[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
        }
      }
      let t = U0; U0 = U1; U1 = t;
          t = V0; V0 = V1; V1 = t;
    }

    // ── Mouse seed ───────────────────────────────────────────────────────────
    const ptr = { x: -9999, y: -9999, active: false };

    function seedMouse() {
      if (!ptr.active) return;
      const cx = ptr.x / CELL_W;
      const cy = ptr.y / CELL_H;
      const r0 = Math.max(0,        Math.floor(cy - SEED_R / CELL_H));
      const r1 = Math.min(rows - 1, Math.ceil (cy + SEED_R / CELL_H));
      const c0 = Math.max(0,        Math.floor(cx - SEED_R / CELL_W));
      const c1 = Math.min(cols - 1, Math.ceil (cx + SEED_R / CELL_W));
      const rr = SEED_R * SEED_R;

      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          const dx = (c + 0.5 - cx) * CELL_W;
          const dy = (r + 0.5 - cy) * CELL_H;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr) continue;
          const t      = 1 - Math.sqrt(d2) / SEED_R;
          const smooth = t * t * (3 - 2 * t);
          const i      = r * cols + c;

          if (textMask[i]) {
            // Border / subtitle: suppress V toward 0 → chars dissolve
            V0[i] *= (1 - 0.40 * smooth);
          } else if (interiorMask[i]) {
            // Interior: inject V → title alpha decreases → title fades
            V0[i] = Math.min(0.25, V0[i] + 0.18 * smooth);
          } else {
            // Regular RD field: cap-inject as before
            V0[i] = Math.min(0.25, V0[i] + 0.12 * smooth);
            U0[i] = Math.max(0.75, U0[i] - 0.09 * smooth);
          }
        }
      }
    }

    // ── Local RD boost ───────────────────────────────────────────────────────
    function localBoostStep(f, k, radius) {
      if (!ptr.active) return;
      const cx = ptr.x / CELL_W;
      const cy = ptr.y / CELL_H;
      const r0 = Math.max(1,        Math.floor(cy - radius / CELL_H));
      const r1 = Math.min(rows - 2, Math.ceil (cy + radius / CELL_H));
      const c0 = Math.max(1,        Math.floor(cx - radius / CELL_W));
      const c1 = Math.min(cols - 2, Math.ceil (cx + radius / CELL_W));
      const rr = radius * radius;

      for (let r = r0; r <= r1; r++) {
        const rp = (r-1)*cols, rc = r*cols, rn = (r+1)*cols;
        for (let c = c0; c <= c1; c++) {
          const dx = (c + 0.5 - cx) * CELL_W;
          const dy = (r + 0.5 - cy) * CELL_H;
          if (dx*dx + dy*dy >= rr) continue;
          const i   = rc + c;
          const u   = U0[i], v = V0[i];
          const Lu  = 0.05*(U0[rp+c-1]+U0[rp+c+1]+U0[rn+c-1]+U0[rn+c+1])
                    + 0.20*(U0[rp+c  ]+U0[rc+c-1]+U0[rc+c+1]+U0[rn+c  ]) - u;
          const Lv  = 0.05*(V0[rp+c-1]+V0[rp+c+1]+V0[rn+c-1]+V0[rn+c+1])
                    + 0.20*(V0[rp+c  ]+V0[rc+c-1]+V0[rc+c+1]+V0[rn+c  ]) - v;
          const uvv = u*v*v;
          const nu  = u + DU*Lu - uvv + f*(1-u);
          const nv  = v + DV*Lv + uvv - (f+k)*v;
          U1[i] = nu<0?0:nu>1?1:nu;
          V1[i] = nv<0?0:nv>1?1:nv;
        }
      }
      for (let r = r0; r <= r1; r++) {
        const rc = r*cols;
        for (let c = c0; c <= c1; c++) {
          const dx = (c+0.5-cx)*CELL_W, dy = (r+0.5-cy)*CELL_H;
          if (dx*dx+dy*dy >= rr) continue;
          const i = rc+c; U0[i]=U1[i]; V0[i]=V1[i];
        }
      }
    }

    // ── Draw ─────────────────────────────────────────────────────────────────
    function draw(bg, fg) {
      ctx.fillStyle = hsl(bg);
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.font         = FONT;
      ctx.textBaseline = 'top';
      ctx.fillStyle    = hsl(fg);

      let i = 0;
      for (let r = 0; r < rows; r++) {
        const y = r * CELL_H;
        for (let c = 0; c < cols; c++, i++) {
          const v   = V0[i];
          const idx = Math.min(NC - 1, Math.floor(v / V_MAX * NC));
          const ch  = (textChars[i] && v > TEXT_VISIBLE) ? textChars[i] : CHARS[idx];
          if (ch === ' ') continue;
          ctx.fillText(ch, c * CELL_W, y);
        }
      }

      // ── Large title with dissolve alpha ──────────────────────────────────
      if (boxGeo) {
        // Compute average V across title-row interior cells
        let vSum = 0, vCnt = 0;
        for (let r = boxGeo.titleR0; r <= boxGeo.titleR1; r++) {
          for (let c = boxGeo.boxLeft + 1; c < boxGeo.boxRight; c++) {
            const i = r * cols + c;
            if (interiorMask[i]) { vSum += V0[i]; vCnt++; }
          }
        }
        const avgV       = vCnt > 0 ? vSum / vCnt : 0;
        const titleAlpha = Math.max(0, 1 - avgV / TITLE_DISSOLVE_V);

        ctx.save();
        ctx.font         = FONT_LG;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = hsl(fg);
        ctx.globalAlpha  = titleAlpha;
        ctx.fillText(TITLE_TEXT, boxGeo.titleDrawX, boxGeo.titleDrawY);
        ctx.restore();
      }

      // Cursor ring
      if (ptr.active) {
        ctx.beginPath();
        ctx.arc(ptr.x, ptr.y, SEED_R, 0, Math.PI * 2);
        ctx.strokeStyle = hsla(fg, 0.22);
        ctx.lineWidth   = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ptr.x, ptr.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = hsla(fg, 0.5);
        ctx.fill();
      }
    }

    // ── Color utilities ──────────────────────────────────────────────────────
    function randomPair() {
      const bgH = Math.random() * 360;
      const fgH = (bgH + 140 + Math.random() * 80) % 360;
      return {
        bg: { h: bgH, s: 30 + Math.random() * 35, l: 5  + Math.random() * 5  },
        fg: { h: fgH, s: 65 + Math.random() * 25, l: 62 + Math.random() * 18 },
      };
    }

    function lerpHSL(a, b, t) {
      let dh = b.h - a.h;
      if (dh >  180) dh -= 360;
      if (dh < -180) dh += 360;
      return { h: (a.h + dh * t + 360) % 360, s: a.s + (b.s - a.s) * t, l: a.l + (b.l - a.l) * t };
    }

    const hsl  = c => `hsl(${c.h.toFixed(1)},${c.s.toFixed(1)}%,${c.l.toFixed(1)}%)`;
    const hsla = (c, a) => `hsla(${c.h.toFixed(1)},${c.s.toFixed(1)}%,${c.l.toFixed(1)}%,${a})`;

    // ── Palette & param state ────────────────────────────────────────────────
    let palA = randomPair(), palB = randomPair(), palT = 0;

    function randParamIdx(exclude) {
      let i;
      do { i = Math.floor(Math.random() * PARAM_SETS.length); } while (i === exclude);
      return i;
    }

    let piA  = randParamIdx(-1);
    let piB  = randParamIdx(piA);
    let parT = 0;
    let curF = PARAM_SETS[piA].f;
    let curK = PARAM_SETS[piA].k;

    // ── Main loop ────────────────────────────────────────────────────────────
    let lastTs = 0;

    function loop(ts) {
      const dt = Math.min(ts - lastTs, 100);
      lastTs = ts;

      palT += dt / COLOR_DUR;
      if (palT >= 1) { palA = palB; palB = randomPair(); palT -= 1; }

      parT += dt / PARAM_DUR;
      if (parT >= 1) { piA = piB; piB = randParamIdx(piA); parT -= 1; }
      curF = PARAM_SETS[piA].f + (PARAM_SETS[piB].f - PARAM_SETS[piA].f) * parT;
      curK = PARAM_SETS[piA].k + (PARAM_SETS[piB].k - PARAM_SETS[piA].k) * parT;

      const bg = lerpHSL(palA.bg, palB.bg, palT);
      const fg = lerpHSL(palA.fg, palB.fg, palT);

      label.style.color = hsl(fg);

      seedMouse();
      for (let s = 0; s < BOOST_STEPS; s++) localBoostStep(curF, curK, BOOST_R * (s + 1));
      for (let s = 0; s < STEPS; s++) stepRD(curF, curK);
      restoreText();
      draw(bg, fg);

      requestAnimationFrame(loop);
    }

    // ── Events ───────────────────────────────────────────────────────────────
    document.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      if (e.deltaY > 0) e.preventDefault();
    }, { passive: false });

    let isTouchDevice = false;

    window.addEventListener('mousemove', e => {
      if (isTouchDevice) return;
      ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true;
    });
    document.addEventListener('mouseleave', () => { ptr.active = false; });
    window.addEventListener('blur',        () => { ptr.active = false; });
    window.addEventListener('touchstart',  () => { isTouchDevice = true; }, { once: true });
    window.addEventListener('deviceorientation', e => {
      if (!isTouchDevice) return;
      const gx = Math.max(-45, Math.min(45,  e.gamma || 0));
      const by = Math.max(-45, Math.min(45, (e.beta  || 0) - 30));
      ptr.x = ((gx + 45) / 90) * window.innerWidth;
      ptr.y = ((by + 45) / 90) * window.innerHeight;
      ptr.active = true;
    });

    // ── Init ────────────────────────────────────────────────────────────────
    resize();
    initRD(curF, curK);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
